server:
  port: ${PORT:8080}

spring:
  application:
    name: carshare-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  config:
    import: optional:file:../.env.local[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DATABASE_URL_UNPOOLED:${DATABASE_URL}}
    user: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

carshare:
  security:
    session-ttl: ${SESSION_TTL:30d}
    reset-token-ttl: ${RESET_TOKEN_TTL:30m}
  auth:
    google-client-id: ${GOOGLE_SERVER_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:}
  email-verification:
    api-key: ${ABSTRACT_EMAIL_API_KEY:}
    url: ${ABSTRACT_EMAIL_API_URL:https://emailreputation.abstractapi.com/v1/}
    timeout-ms: ${ABSTRACT_EMAIL_TIMEOUT_MS:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  uploads:
    vehicle-directory: ${VEHICLE_UPLOAD_DIRECTORY:public/uploads/vehicles}
    support-directory: ${SUPPORT_UPLOAD_DIRECTORY:public/uploads/support}
    lost-and-found-directory: ${LOST_AND_FOUND_UPLOAD_DIRECTORY:public/uploads/lost-and-found}
  support:
    tika-url: ${SUPPORT_TIKA_URL:http://localhost:9998}
    open-meteo-url: ${SUPPORT_OPEN_METEO_URL:https://archive-api.open-meteo.com/v1/archive}
    overpass-url: ${SUPPORT_OVERPASS_URL:https://overpass-api.de/api/interpreter}
    osrm-url: ${SUPPORT_OSRM_URL:https://router.project-osrm.org}
    external-timeout-seconds: ${SUPPORT_EXTERNAL_TIMEOUT_SECONDS:12}
