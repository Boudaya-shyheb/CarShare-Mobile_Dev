<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · CarShare</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f7faf9;color:#17202a;margin:0;min-height:100vh;display:grid;place-items:center}
    main{background:white;padding:32px;border-radius:20px;box-shadow:0 8px 35px #102a4315;width:min(380px,calc(100% - 48px))}
    h1{margin-top:0}label{display:block;margin:16px 0 6px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d5dee5;border-radius:12px;font:inherit}
    button{margin-top:20px;width:100%;padding:14px;background:#059669;color:white;border:0;border-radius:12px;font:700 16px system-ui;cursor:pointer}
    #message{margin-top:16px;color:#b42318}#message.ok{color:#047857}
  </style>
</head>
<body><main>
  <h1>Reset your password</h1><p>Choose a new password for your CarShare account.</p>
  <form id="form">
    <label for="password">New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password">
    <label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password">
    <button type="submit">Update password</button>
  </form><p id="message" role="status"></p>
  <script>
    const form=document.querySelector('#form'),message=document.querySelector('#message'),token=new URLSearchParams(location.search).get('token');
    form.addEventListener('submit',async e=>{e.preventDefault();message.className='';message.textContent='';
      if(!token){message.textContent='This password reset link is invalid or has expired.';return}
      const password=document.querySelector('#password').value,confirm=document.querySelector('#confirm').value;
      if(password!==confirm){message.textContent='Passwords do not match.';return}
      try{const response=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:password})});
        const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail||'We could not reset your password. Please request a new link.');
        message.className='ok';message.textContent=data.message||'Your password has been reset. You can now sign in.';form.hidden=true;
      }catch(error){message.textContent=error.message||'Connection problem. Please try again.'}
    });
  </script>
</main></body></html>
